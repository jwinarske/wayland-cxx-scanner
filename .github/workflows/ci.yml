name: CI

on:
  push:
    branches:
      - main
      - master
      - "copilot/**"
  pull_request:
    branches:
      - main
      - master

# Deny all permissions at the workflow level; each job grants only what it needs.
permissions: {}

jobs:
  ubuntu:
    name: Ubuntu (${{ matrix.compiler }}, ${{ matrix.std }})
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        # C++17 is the project floor; C++20/C++23 must keep building too.
        std: [c++17, c++20, c++23]
        include:
          - compiler: gcc
            CC: gcc
            CXX: g++
          - compiler: clang
            CC: clang-19
            CXX: clang++-19

    env:
      CC: ${{ matrix.CC }}
      CXX: ${{ matrix.CXX }}

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            meson ninja-build \
            gcc g++ \
            clang-19 \
            libwayland-dev \
            wayland-protocols \
            libpugixml-dev

      - name: Configure
        run: |
          meson setup builddir \
            -Dtests=true \
            -Dexamples=true \
            -Dcpp_std=${{ matrix.std }} \
            --wrap-mode=forcefallback

      - name: Build
        run: ninja -C builddir

      - name: Test
        run: meson test -C builddir --print-errorlogs

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-ubuntu-${{ matrix.compiler }}-${{ matrix.std }}
          path: builddir/meson-logs/

  sanitizers:
    name: Sanitizers (ASan+UBSan, clang)
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    env:
      CC: clang-19
      CXX: clang++-19

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            meson ninja-build \
            clang-19 \
            libwayland-dev \
            wayland-protocols \
            libpugixml-dev

      # The live-dispatch roundtrip tests drive libwayland's real C listener
      # ABI, where a wrong-width argument slot is a silent truncated load rather
      # than a visible failure. They only catch that class of defect with a
      # sanitizer attached, so this is the job that makes them mean something.
      # Meson exports halt_on_error=1:abort_on_error=1 for the test runner.
      # default_library=static is load-bearing: the GoogleTest wrap otherwise
      # builds a shared libgtest, and clang links the ASan runtime statically
      # into executables only, so the .so is left with undefined __asan_*
      # symbols.  Static libraries put the runtime where clang expects it.
      - name: Configure
        run: |
          meson setup builddir \
            -Db_sanitize=address,undefined \
            -Ddefault_library=static \
            -Dtests=true \
            -Dexamples=false \
            --wrap-mode=forcefallback

      - name: Build
        run: ninja -C builddir

      - name: Test
        run: meson test -C builddir --print-errorlogs

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-sanitizers
          path: builddir/meson-logs/

  ime-backends:
    name: IME backend (${{ matrix.ime_backend }})
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # One build per implemented IME backend (extended as backends land).
        ime_backend: [text-input-v1, text-input-v3]

    env:
      CC: gcc
      CXX: g++

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            meson ninja-build \
            gcc g++ \
            libwayland-dev \
            wayland-protocols \
            libpugixml-dev

      - name: Configure
        run: |
          meson setup builddir \
            -Dtests=true \
            -Dime_backend=${{ matrix.ime_backend }} \
            --wrap-mode=forcefallback

      - name: Build
        run: ninja -C builddir

      - name: Test
        run: meson test -C builddir --print-errorlogs

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-ime-${{ matrix.ime_backend }}
          path: builddir/meson-logs/

  fedora:
    name: Fedora (${{ matrix.compiler }})
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        include:
          - compiler: gcc
            CC: gcc
            CXX: g++
          - compiler: clang
            CC: clang
            CXX: clang++

    container:
      image: fedora:latest

    env:
      CC: ${{ matrix.CC }}
      CXX: ${{ matrix.CXX }}

    steps:
      - name: Install git and dependencies
        run: |
          dnf install -y \
            git \
            meson ninja-build \
            gcc gcc-c++ \
            clang \
            wayland-devel \
            wayland-protocols-devel \
            pugixml-devel \
            gtest-devel gmock-devel

      - uses: actions/checkout@v4

      - name: Configure
        run: |
          meson setup builddir \
            -Dtests=true \
            -Dexamples=true \
            --wrap-mode=forcefallback

      - name: Build
        run: ninja -C builddir

      - name: Test
        run: meson test -C builddir --print-errorlogs

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-fedora-${{ matrix.compiler }}
          path: builddir/meson-logs/
